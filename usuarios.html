<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Cantina MetalVale</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <header class="topo">
        <h1 class="marca">Cantina <span>MetalVale</span></h1>
        <p class="slogan">Retirada de lanches sem ficha de papel</p>
        <nav id="menu" class="menu"></nav>
    </header>

    <main class="conteudo">
        <div class="painel">
            <button class="inserir" onclick="abrirFormulario(-1)">Inserir</button>

            <section class="cartao" id="formulario" hidden>
                <h2 id="titulo-form">Novo usuário</h2>
                <form onsubmit="salvar(); return false;">
                    <label for="matricula">Matrícula</label>
                    <input id="matricula" type="text" inputmode="numeric" required>

                    <label for="nome">Nome</label>
                    <input id="nome" type="text" required>

                    <label for="senha">Senha</label>
                    <input id="senha" type="password">

                    <label for="perfil">Perfil</label>
                    <select id="perfil">
                        <option value="atendente">atendente</option>
                        <option value="supervisor">supervisor</option>
                    </select>

                    <button type="submit">Salvar</button>
                    <button type="button" class="secundario" onclick="fecharFormulario()">Cancelar</button>
                </form>
                <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
            </section>

            <table id="retorno_tabela"></table>
        </div>
    </main>

    <footer class="rodape">
        <p>MetalVale Componentes S.A. &bull; Vale do Itajaí/SC</p>
    </footer>

    <script src="js/funcoes.js"></script>
    <script src="js/app.js"></script>

    <script>
    let usuarios = [];

    async function chamarApi(opcoes) {
        const resposta = await fetch('api/usuarios.php', opcoes);
        if (resposta.status === 401) {
            alert('Faça login como supervisor.');
            location.href = 'index.html';
        }
        return resposta.json();
    }

    async function carregar() {
        usuarios = await chamarApi();
        listar();
    }

    function enviar(dados) {
        return chamarApi({
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dados)
        });
    }

    function listar() {
        let html = '<tr><th>Matricula</th><th>Nome</th><th>Perfil</th><th>Ações</th></tr>';
        usuarios.forEach((usuario, i) => {
            html += '<tr>';
            html += '<td>'+usuario.matricula+'</td>';
            html += '<td>'+usuario.nome+'</td>';
            html += '<td>'+usuario.perfil+'</td>';
            html += '<td><button onclick="abrirFormulario('+i+')">Editar</button> ';
            html += '<button class="excluir" onclick="excluir('+i+')">Excluir</button></td>';
            html += '</tr>';
        });
        document.getElementById('retorno_tabela').innerHTML = html;
    }

    let indiceEdicao = -1; // -1 = inserindo, senão posição do usuário no array

    function abrirFormulario(i) {
        indiceEdicao = i;
        const usuario =  usuarios[i];
        document.getElementById('titulo-form').textContent = i === -1 ? 'Novo usuário' : 'Editar usuário';
        document.getElementById('matricula').value = usuario.matricula;
        document.getElementById('nome').value = usuario.nome;
        document.getElementById('senha').value = ''; // a senha fica só como hash no banco
        document.getElementById('senha').required = i === -1;
        document.getElementById('senha').placeholder = i === -1 ? '' : 'Deixe em branco para manter';
        document.getElementById('perfil').value = usuario.perfil;
        mostrarMensagem('', '');
        document.getElementById('formulario').hidden = false;
        document.getElementById('matricula').focus();
    }

    function fecharFormulario() {
        document.getElementById('formulario').hidden = true;
    }

    async function salvar() {
        const dados = {
            acao: indiceEdicao === -1 ? 'inserir' : 'editar',
            id: indiceEdicao === -1 ? 0 : usuarios[indiceEdicao].id,
            matricula: document.getElementById('matricula').value.trim(),
            nome: document.getElementById('nome').value.trim(),
            senha: document.getElementById('senha').value,
            perfil: document.getElementById('perfil').value
        };
        if (dados.matricula === '' || dados.nome === '' || (dados.acao === 'inserir' && dados.senha === '')) {
            mostrarMensagem('Preencha todos os campos.', 'erro');
            return;
        }
        const resultado = await enviar(dados);
        if (resultado.erro) {
            mostrarMensagem(resultado.erro, 'erro');
            return;
        }
        fecharFormulario();
        carregar();
    }

    async function excluir(i) {
        if (!confirm('Excluir ' + usuarios[i].nome + '?')) return;
        const resultado = await enviar({ acao: 'excluir', id: usuarios[i].id });
        if (resultado.erro) {
            alert(resultado.erro);
            return;
        }
        fecharFormulario(); // evita editar a posição errada depois de recarregar
        carregar();
    }

    carregar();
    </script>

    
</body>
</html>
